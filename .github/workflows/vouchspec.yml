name: VouchSpec publisher evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  inspect-and-attest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - evidence-case: structural-pass
            skill-path: skills/hello-vouchspec
            expected-structure-status: pass
          - evidence-case: structural-failure
            skill-path: skills/structural-failure
            expected-structure-status: fail
    steps:
      - name: Check out the exact publisher commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Select the hash-locked action runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Generate exact-commit VouchSpec evidence
        id: vouchspec
        uses: mordiaky/vouchspec/distribution/github-action@ed812a19184d3fa388d854f71b72fb4aa78e2712 # immutable action snapshot
        with:
          skill-path: ${{ matrix.skill-path }}

      - name: Confirm the expected evidence result
        shell: bash
        env:
          ACTUAL_STRUCTURE_STATUS: ${{ steps.vouchspec.outputs.structure-status }}
          EXPECTED_STRUCTURE_STATUS: ${{ matrix.expected-structure-status }}
        run: test "$ACTUAL_STRUCTURE_STATUS" = "$EXPECTED_STRUCTURE_STATUS"

      - name: Attest the receipt draft to this workflow
        id: attest-receipt
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ steps.vouchspec.outputs.receipt-path }}

      - name: Attest the workflow binding request
        id: attest-request
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ steps.vouchspec.outputs.ci-request-path }}

      - name: Upload the exact evidence files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vouchspec-publisher-evidence-${{ matrix.evidence-case }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.vouchspec.outputs.receipt-path }}
            ${{ steps.vouchspec.outputs.ci-request-path }}

      - name: Publish verification links
        shell: bash
        env:
          EVIDENCE_CASE: ${{ matrix.evidence-case }}
          STRUCTURE_STATUS: ${{ steps.vouchspec.outputs.structure-status }}
          RECEIPT_ATTESTATION_URL: ${{ steps.attest-receipt.outputs.attestation-url }}
          REQUEST_ATTESTATION_URL: ${{ steps.attest-request.outputs.attestation-url }}
        run: |
          {
            echo "## VouchSpec publisher evidence"
            echo
            echo "- Case: $EVIDENCE_CASE"
            echo "- Structure status: $STRUCTURE_STATUS"
            echo "- Receipt-draft attestation: $RECEIPT_ATTESTATION_URL"
            echo "- Workflow-binding attestation: $REQUEST_ATTESTATION_URL"
            echo
            echo "These attestations establish publisher workflow provenance."
            echo "They are not a VouchSpec safety certification or issuer signature."
          } >> "$GITHUB_STEP_SUMMARY"
